name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q

  retrieval-regression:
    # Runs a fixed eval subset on a seeded slice of the corpus and fails if retrieval quality
    # drops more than the allowed margin below ci/baseline.json.
    runs-on: ubuntu-latest
    needs: test
    env:
      XDG_CACHE_HOME: /home/runner/.cache/models  # downloaded embedding/reranker models
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/models
          key: models-${{ hashFiles('configs/ci.yaml') }}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - name: Build corpus at the pinned docs commit
        run: rageval ingest --ref "$(cat data/CORPUS_COMMIT)"
      - name: Sample CI corpus (gold docs + seeded distractors)
        run: rageval sample-corpus --distractors 300
      - name: Evaluate
        run: rageval eval --config configs/ci.yaml --out runs/ci
      - name: Gate on regression
        run: rageval gate --run runs/ci --baseline ci/baseline.json --max-drop 0.03
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-eval
          path: runs/ci
